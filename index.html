<!DOCTYPE html>
<html>

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>PA#2</title>
    <style>
        body {
            background-color: #EEEEEE;
        }
    </style>

    <script type="module" src="./Utils/trackball-rotator.js"></script>
    <script src="./Utils/m4.js"></script>
    <script type="module" src="./main.js"></script>
    <script type="module" src="./model.js"></script>
    <script type="module" src="./stereo.js"></script>
    <script type="module" src="./texture.js"></script>
    <script type="module" src="./shader.js"></script>
</head>

<body>
    <h2>Surface of Revolution of a Parabola of Arbitrary Position</h2>
    <p id="message">Drag your mouse to rotate it.<br>
        (On a touch screen, you can use your finger.)</p>
    <div>
        <label for="eyeSeparation">Eyes Separation:</label>
        <input type="range" id="eyeSeparation" min="0.1" max="1.0" value="0.7" step="0.1">
    </div>
    <div>
        <label for="fov">FOV:</label>
        <input type="range" id="fov" min="0.1" max="1.0" value="0.5" step="0.1">
    </div>
    <div>
        <label for="nearClippingDistance">Near Clipping Distance:</label>
        <input type="range" id="nearClippingDistance" min="1.0" max="10.0" value="8.0">
    </div>
    <div>
        <label for="convergence">Convergence:</label>
        <input type="range" id="convergence" min="10.0" max="30.0" value="14.0">
    </div>
    <div id="canvas-holder">
        <canvas width="600" height="600" id="webglcanvas" style="background-color:black"></canvas>
    </div>
</body>

</html>
